name: Sync OpenRift market data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

jobs:
  sync-market-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch OpenRift marketplace data
        run: node scripts/sync-openrift-market.mjs

      - name: Commit refreshed CSV
        run: |
          if git diff --quiet -- data/openrift-market.csv; then
            echo "No marketplace data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/openrift-market.csv
          git commit -m "Refresh OpenRift market data"
          git push
